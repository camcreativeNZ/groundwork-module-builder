# Groundwork house theme: design direction B (calm and premium).
# An enterprise customer gets a copy of this folder with their own colours and logo.
# The generator checks every text colour against its background (WCAG AA, 4.5:1).

name: Groundwork (direction B)

fonts:
  heading:
    family: Plus Jakarta Sans
    file: fonts/plus-jakarta-sans-latin.woff2
    weights: 200 800
    fallback: '"Helvetica Neue", Arial, sans-serif'
  body:
    family: Source Sans 3
    file: fonts/source-sans-3-latin.woff2
    italic_file: fonts/source-sans-3-italic-latin.woff2
    weights: 200 900
    fallback: '"Segoe UI", Arial, sans-serif'
  licences: [fonts/OFL-PlusJakartaSans.txt, fonts/OFL-SourceSans3.txt]

# logo: { file: logo.svg, alt: Customer name }   # optional, shown above the module title

shape:
  radius: 18px
  button_radius: 10px
  heading_weight: 700
  heading_size: 2.1rem
  heading_tracking: -0.02em
  card_border: 1px solid transparent

light:
  bg: "#eef2f6"
  surface: "#ffffff"
  surface-2: "#f5f7fa"
  ink: "#16233a"
  ink-soft: "#55627a"
  line: "#dbe2ea"
  accent: "#2f5bd3"
  accent-ink: "#ffffff"
  accent-soft: "#e6edfb"
  mark: "#fde9a8"
  head-bg: "#ffffff"
  head-ink: "#16233a"
  bar-bg: "#dbe2ea"
  bar: "#2f5bd3"
  focus: "#b86a00"   # was #e08a00 in the F3 pilot, which failed the 3:1 focus-ring check on light backgrounds
  part-1: "#8a4b08"
  part-1-soft: "#fbeedd"
  part-2: "#1d6b46"
  part-2-soft: "#e0f1e8"
  part-3: "#5b3c99"
  part-3-soft: "#ece5f8"
  part-4: "#0b5e7a"
  part-4-soft: "#dcf0f6"
  right: "#1d6b46"
  right-soft: "#e0f1e8"
  wrong: "#a3261b"
  wrong-soft: "#fbe5e2"
  warn: "#7a5200"
  warn-soft: "#fff2cc"
  card-shadow: "0 1px 2px rgba(22,35,58,.06), 0 10px 28px rgba(22,35,58,.08)"

dark:
  bg: "#0e1420"
  surface: "#18202e"
  surface-2: "#1d2737"
  ink: "#e8edf5"
  ink-soft: "#a3aec2"
  line: "#2b3547"
  accent: "#8aa8ff"
  accent-ink: "#0e1420"
  accent-soft: "#1f2b47"
  mark: "#5c4d12"
  head-bg: "#18202e"
  head-ink: "#e8edf5"
  bar-bg: "#2b3547"
  bar: "#8aa8ff"
  focus: "#e08a00"
  part-1: "#f0b46a"
  part-1-soft: "#3a2a17"
  part-2: "#77d1a2"
  part-2-soft: "#173226"
  part-3: "#b9a1f0"
  part-3-soft: "#2b2340"
  part-4: "#7cc8e3"
  part-4-soft: "#163039"
  right: "#77d1a2"
  right-soft: "#173226"
  wrong: "#ff9a8e"
  wrong-soft: "#3d1c19"
  warn: "#f3c969"
  warn-soft: "#3a2f12"
  card-shadow: "0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25)"
